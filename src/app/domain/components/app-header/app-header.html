<header class="app-header" [class.compact]="responsive.youJokingRight()">
  <div class="app-header__inner">
    <app-button
      variant="ghost"
      class="app-header__logo"
      (click)="goToHome()"
      [class.app-header__logo--compact]="responsive.youJokingRight()"
    >
      Digital<span class="logo-accent">Book</span>Store
    </app-button>

    <div class="app-header__right">
      @if (!responsive.youJokingRight()) {
        <nav class="app-header__nav" aria-label="Main navigation">
          <button class="app-header__nav-link" (click)="goToAbout()">About</button>
        </nav>
      }

      <app-button
        variant="ghost"
        class="app-header__cart-btn"
        (click)="goToCart()"
        [attr.aria-label]="'Cart, ' + cartService.totalItemsInCart() + ' items'"
      >
        <svg
          class="app-header__cart-icon"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="9" cy="21" r="1" />
          <circle cx="20" cy="21" r="1" />
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6" />
        </svg>
        @if (cartService.totalItemsInCart() > 0) {
          <span class="app-header__cart-badge">{{
            cartService.totalItemsInCart() > 99 ? '99+' : cartService.totalItemsInCart()
          }}</span>
        }
      </app-button>
    </div>
  </div>
</header>
