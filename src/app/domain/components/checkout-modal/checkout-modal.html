<!-- Backdrop -->
<div class="checkout-modal__backdrop" (click)="cancel()" aria-hidden="true"></div>

<!-- Dialog panel -->
<div
  class="checkout-modal__panel"
  role="dialog"
  aria-modal="true"
  aria-labelledby="checkout-modal-title"
>
  <!-- Header -->
  <div class="checkout-modal__header">
    <h2 class="checkout-modal__title" id="checkout-modal-title">Checkout</h2>
    <app-button
      variant="ghost"
      class="checkout-modal__close"
      aria-label="Close checkout"
      [disabled]="processing()"
      (click)="cancel()"
    >
      <svg
        class="checkout-modal__close-icon"
        viewBox="0 0 20 20"
        fill="currentColor"
        aria-hidden="true"
      >
        <path
          fill-rule="evenodd"
          d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414
             L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293
             a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
          clip-rule="evenodd"
        />
      </svg>
    </app-button>
  </div>

  <!-- Order total -->
  <div class="checkout-modal__totals">
    <span class="checkout-modal__totals-label">Order total</span>
    <span class="checkout-modal__totals-value">{{ total() | appCurrency }}</span>
  </div>

  <!-- Payment method selection -->
  <p class="checkout-modal__section-label">Payment method</p>

  <div class="checkout-modal__methods" role="radiogroup" aria-label="Payment method">
    <!-- Credit / Debit Card -->
    <button
      class="checkout-modal__method"
      [class.checkout-modal__method--selected]="selectedMethod() === 'card'"
      role="radio"
      [attr.aria-checked]="selectedMethod() === 'card'"
      [disabled]="processing()"
      (click)="selectMethod('card')"
    >
      <span class="checkout-modal__method-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="1" y="4" width="22" height="16" rx="2" ry="2" />
          <line x1="1" y1="10" x2="23" y2="10" />
        </svg>
      </span>
      <span class="checkout-modal__method-info">
        <span class="checkout-modal__method-name">Credit / Debit Card</span>
        <span class="checkout-modal__method-desc">Visa, Mastercard, Elo &amp; more</span>
      </span>
      <span class="checkout-modal__method-radio" aria-hidden="true"></span>
    </button>

    <!-- PayPal -->
    <button
      class="checkout-modal__method"
      [class.checkout-modal__method--selected]="selectedMethod() === 'paypal'"
      role="radio"
      [attr.aria-checked]="selectedMethod() === 'paypal'"
      [disabled]="processing()"
      (click)="selectMethod('paypal')"
    >
      <span class="checkout-modal__method-icon" aria-hidden="true">
        <svg role="img" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="currentColor">
          <path
            d="M15.607 4.653H8.941L6.645 19.251H1.82L4.862 0h7.995c3.754 0 6.375 2.294 6.473 5.513
               -.648-.478-2.105-.86-3.722-.86
               m6.57 5.546c0 3.41-3.01 6.853-6.958 6.853h-2.493L11.595 24H6.74l1.845-11.538h3.592
               c4.208 0 7.346-3.634 7.153-6.949a5.24 5.24 0 0 1 2.848 4.686
               M9.653 5.546h6.408c.907 0 1.942.222 2.363.541-.195 2.741-2.655 5.483-6.441 5.483H8.714Z"
          />
        </svg>
      </span>
      <span class="checkout-modal__method-info">
        <span class="checkout-modal__method-name">PayPal</span>
        <span class="checkout-modal__method-desc">Fast and secure checkout</span>
      </span>
      <span class="checkout-modal__method-radio" aria-hidden="true"></span>
    </button>

    <!-- PIX -->
    <button
      class="checkout-modal__method"
      [class.checkout-modal__method--selected]="selectedMethod() === 'pix'"
      role="radio"
      [attr.aria-checked]="selectedMethod() === 'pix'"
      [disabled]="processing()"
      (click)="selectMethod('pix')"
    >
      <span class="checkout-modal__method-icon" aria-hidden="true">
        <svg role="img" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="currentColor">
          <path
            d="M5.283 18.36a3.505 3.505 0 0 0 2.493-1.032l3.6-3.6a.684.684 0 0 1 .946 0
               l3.613 3.613a3.504 3.504 0 0 0 2.493 1.032h.71l-4.56 4.56a3.647 3.647 0 0 1-5.156 0L4.85 18.36Z
               M18.428 5.627a3.505 3.505 0 0 0-2.493 1.032l-3.613 3.614a.67.67 0 0 1-.946 0
               l-3.6-3.6A3.505 3.505 0 0 0 5.283 5.64h-.434l4.573-4.572a3.646 3.646 0 0 1 5.156 0l4.559 4.559Z
               M1.068 9.422 3.79 6.699h1.492a2.483 2.483 0 0 1 1.744.722l3.6 3.6a1.73 1.73 0 0 0 2.443 0
               l3.614-3.613a2.482 2.482 0 0 1 1.744-.723h1.767l2.737 2.737a3.646 3.646 0 0 1 0 5.156
               l-2.736 2.736h-1.768a2.482 2.482 0 0 1-1.744-.722l-3.613-3.613a1.77 1.77 0 0 0-2.444 0
               l-3.6 3.6a2.483 2.483 0 0 1-1.744.722H3.791l-2.723-2.723a3.646 3.646 0 0 1 0-5.156"
          />
        </svg>
      </span>
      <span class="checkout-modal__method-info">
        <span class="checkout-modal__method-name">PIX</span>
        <span class="checkout-modal__method-desc">Instant Brazilian payment</span>
      </span>
      <span class="checkout-modal__method-radio" aria-hidden="true"></span>
    </button>
  </div>

  <!-- Actions -->
  <div class="checkout-modal__actions">
    <app-button variant="outline" [disabled]="processing()" (click)="cancel()"> Cancel </app-button>
    <app-button variant="primary" [disabled]="processing()" (click)="confirmPayment()">
      @if (processing()) {
        <span class="checkout-modal__spinner"></span>
        Processing…
      } @else {
        Confirm Payment
      }
    </app-button>
  </div>
</div>
