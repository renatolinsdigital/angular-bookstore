<button
  class="app-btn"
  [class.app-btn--primary]="variant() === 'primary'"
  [class.app-btn--outline]="variant() === 'outline'"
  [class.app-btn--cta]="variant() === 'cta'"
  [class.app-btn--download]="variant() === 'download'"
  [class.app-btn--ghost]="variant() === 'ghost'"
  [class.app-btn--full-width]="fullWidth()"
  [type]="type()"
  [disabled]="disabled()"
>
  <ng-content />
  @if (variant() === 'cta' && !hideArrow()) {
    <svg class="app-btn__cta-arrow" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
      <path
        fill-rule="evenodd"
        d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z"
        clip-rule="evenodd"
      />
    </svg>
  }
</button>
