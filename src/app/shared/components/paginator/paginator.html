<div class="paginator" role="navigation" aria-label="Page navigation">
  <!-- Info row -->
  <p class="paginator__info">
    Page <strong class="paginator__info-highlight">{{ currentPage() }}</strong>
    <span class="paginator__info-sep">of</span>
    <strong class="paginator__info-highlight">{{ totalPages() }}</strong>
    @if (totalItems()) {
      <span class="paginator__info-dot" aria-hidden="true">·</span>
      <span class="paginator__info-count">{{ totalItems() }} books</span>
    }
  </p>

  <!-- Controls row -->
  <div class="paginator__controls">
    <!-- Prev -->
    <button
      class="paginator__btn paginator__btn--arrow"
      [disabled]="currentPage() <= 1"
      (click)="goTo(currentPage() - 1)"
      aria-label="Previous page"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <polyline points="15 18 9 12 15 6" />
      </svg>
    </button>

    <!-- Page number tokens -->
    @for (token of pages(); track $index) {
      @if (token === null) {
        <span class="paginator__ellipsis" aria-hidden="true">…</span>
      } @else {
        <button
          class="paginator__btn"
          [class.paginator__btn--active]="token === currentPage()"
          [attr.aria-current]="token === currentPage() ? 'page' : null"
          [attr.aria-label]="'Page ' + token"
          (click)="goTo(token)"
        >
          {{ token }}
        </button>
      }
    }

    <!-- Go-to input -->
    <div class="paginator__goto" title="Jump to page">
      <span class="paginator__goto-label" aria-hidden="true">Go to</span>
      <input
        class="paginator__goto-input"
        type="number"
        [min]="1"
        [max]="totalPages()"
        [placeholder]="currentPage()"
        aria-label="Jump to page number"
        (keydown.enter)="goToInput($event)"
      />
    </div>

    <!-- Next -->
    <button
      class="paginator__btn paginator__btn--arrow"
      [disabled]="currentPage() >= totalPages()"
      (click)="goTo(currentPage() + 1)"
      aria-label="Next page"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <polyline points="9 18 15 12 9 6" />
      </svg>
    </button>
  </div>
</div>
