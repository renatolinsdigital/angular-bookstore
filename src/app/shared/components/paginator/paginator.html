<nav class="paginator" aria-label="Page navigation">
  <!-- Previous -->
  <button
    class="paginator__btn paginator__btn--arrow"
    [disabled]="currentPage() <= 1"
    (click)="goTo(currentPage() - 1)"
    aria-label="Previous page"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <polyline points="15 18 9 12 15 6" />
    </svg>
  </button>

  <!-- Page numbers / ellipsis -->
  @for (token of pages(); track $index) {
    @if (token === null) {
      <span class="paginator__ellipsis" aria-hidden="true">…</span>
    } @else {
      <button
        class="paginator__btn"
        [class.paginator__btn--active]="token === currentPage()"
        [attr.aria-current]="token === currentPage() ? 'page' : null"
        [attr.aria-label]="'Page ' + token"
        (click)="goTo(token)"
      >
        {{ token }}
      </button>
    }
  }

  <!-- Next -->
  <button
    class="paginator__btn paginator__btn--arrow"
    [disabled]="currentPage() >= totalPages()"
    (click)="goTo(currentPage() + 1)"
    aria-label="Next page"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <polyline points="9 18 15 12 9 6" />
    </svg>
  </button>
</nav>
