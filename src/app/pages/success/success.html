<app-page-container>
  <div class="success__card">
    <p
      class="success__title"
      [class.success__title--compact]="responsive.youJokingRight()"
      [class.success__title--smaller]="responsive.isSmaller()"
    >
      Purchase completed successfully. Download your books below and enjoy your reading time!
    </p>

    <div
      class="success__image-wrapper"
      [class.success__image-wrapper--small]="responsive.isSmall()"
    >
      <img
        src="assets/images/characters_success.png"
        alt="Order Success"
        class="success__image"
        [class.success__image--tiny]="responsive.youJokingRight()"
      />
    </div>

    <!-- Download list -->
    <div class="success__downloads">
      @for (item of downloadService.downloadItems(); track item.id) {
        <div
          class="success__download-item"
          [class.success__download-item--column]="responsive.isSmaller()"
        >
          <span
            class="success__item-title"
            [class.success__item-title--compact]="responsive.youJokingRight()"
          >
            {{ item.title }}
          </span>
          <app-button
            variant="download"
            [fullWidth]="responsive.isSmaller()"
            (click)="downloadItem(item.downloadUrl)"
          >
            Download
          </app-button>
        </div>
      }
    </div>

    <app-button variant="primary" (click)="goToHome()">BACK TO STORE</app-button>
  </div>
</app-page-container>
