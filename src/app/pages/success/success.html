<div class="success">
  <!-- Decorative background glows -->
  <div class="success__bg-glow success__bg-glow--left" aria-hidden="true"></div>
  <div class="success__bg-glow success__bg-glow--right" aria-hidden="true"></div>

  <app-page-container>
    <div class="success__hero-card">
      <!-- Floating sparkle particles -->
      <div class="success__spark success__spark--1" aria-hidden="true"></div>
      <div class="success__spark success__spark--2" aria-hidden="true"></div>
      <div class="success__spark success__spark--3" aria-hidden="true"></div>
      <div class="success__spark success__spark--4" aria-hidden="true"></div>
      <div class="success__spark success__spark--5" aria-hidden="true"></div>
      <div class="success__spark success__spark--6" aria-hidden="true"></div>
      <div class="success__spark success__spark--7" aria-hidden="true"></div>
      <div class="success__spark success__spark--8" aria-hidden="true"></div>

      <div class="success__hero-content">
        <div class="success__badge">
          <svg
            class="success__badge-icon"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            width="13"
            height="13"
            aria-hidden="true"
          >
            <polyline
              points="20 6 9 17 4 12"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          Thank you for your purchase!
        </div>
        <h1 class="success__title">Your books are ready</h1>
        <p class="success__subtitle">
          Download your new books below and enjoy unlimited reading time.
        </p>
        <div class="success__stats">
          <div class="success__stat">
            <span class="success__stat-value">Freedom</span>
            <span class="success__stat-label">DRM-Free books</span>
          </div>
          <div class="success__stat-divider" aria-hidden="true"></div>
          <div class="success__stat">
            <span class="success__stat-value">∞</span>
            <span class="success__stat-label">Re-downloads</span>
          </div>
        </div>

        <div class="success__downloads">
          @for (item of downloadService.downloadItems(); track item.id) {
            <div
              class="success__download-item"
              [class.success__download-item--column]="responsive.isSmaller()"
            >
              <span
                class="success__item-title"
                [class.success__item-title--compact]="responsive.youJokingRight()"
              >
                {{ item.title }}
              </span>
              <app-button
                variant="download"
                [fullWidth]="responsive.isSmaller()"
                (click)="downloadItem(item.downloadUrl)"
              >
                Download
              </app-button>
            </div>
          }
        </div>

        <div class="success__actions">
          <app-button variant="primary" (click)="goToHome()">BACK TO STORE</app-button>
        </div>
      </div>
      <div class="success__hero-visual">
        <!-- Pulsing success rings -->
        <div class="success__ring success__ring--1" aria-hidden="true"></div>
        <div class="success__ring success__ring--2" aria-hidden="true"></div>
        <img
          src="assets/images/characters_success.png"
          alt="Order Success"
          class="success__image"
        />
      </div>
    </div>
  </app-page-container>
</div>
