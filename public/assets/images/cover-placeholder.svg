<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 800" width="620" height="800">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#1a2d4a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="spineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(245,158,11,0.18)"/>
      <stop offset="100%" stop-color="rgba(245,158,11,0)"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="48%" r="38%">
      <stop offset="0%" stop-color="rgba(245,158,11,0.14)"/>
      <stop offset="100%" stop-color="rgba(245,158,11,0)"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="620" height="800" fill="url(#bgGrad)"/>

  <!-- Top glow -->
  <rect width="620" height="320" fill="url(#glowGrad)" opacity="0.7"/>

  <!-- Center ambient glow -->
  <ellipse cx="310" cy="380" rx="260" ry="220" fill="url(#centerGlow)"/>

  <!-- Spine accent on the left -->
  <rect x="0" y="0" width="14" height="800" fill="url(#spineGrad)"/>
  <rect x="14" y="0" width="4" height="800" fill="rgba(0,0,0,0.35)"/>

  <!-- Decorative corner ornaments -->
  <path d="M 38 30 L 68 30 L 68 34 L 42 34 L 42 60 L 38 60 Z" fill="rgba(245,158,11,0.35)"/>
  <path d="M 582 30 L 552 30 L 552 34 L 578 34 L 578 60 L 582 60 Z" fill="rgba(245,158,11,0.35)"/>
  <path d="M 38 770 L 68 770 L 68 766 L 42 766 L 42 740 L 38 740 Z" fill="rgba(245,158,11,0.35)"/>
  <path d="M 582 770 L 552 770 L 552 766 L 578 766 L 578 740 L 582 740 Z" fill="rgba(245,158,11,0.35)"/>

  <!-- Outer border -->
  <rect x="18" y="18" width="584" height="764" rx="3" fill="none" stroke="rgba(245,158,11,0.18)" stroke-width="1.5"/>

  <!-- Book icon (open book) centered -->
  <g transform="translate(234, 270)">
    <!-- Left page -->
    <path d="M76 22 C76 22 52 18 20 26 L20 98 C52 90 76 94 76 94 L76 22Z"
          fill="none" stroke="rgba(245,158,11,0.7)" stroke-width="3" stroke-linejoin="round"/>
    <!-- Right page -->
    <path d="M76 22 C76 22 100 18 132 26 L132 98 C100 90 76 94 76 94 L76 22Z"
          fill="none" stroke="rgba(245,158,11,0.7)" stroke-width="3" stroke-linejoin="round"/>
    <!-- Spine line -->
    <line x1="76" y1="22" x2="76" y2="94" stroke="rgba(245,158,11,0.9)" stroke-width="2.5"/>
    <!-- Lines on left page -->
    <line x1="34" y1="48" x2="68" y2="44" stroke="rgba(245,158,11,0.35)" stroke-width="2" stroke-linecap="round"/>
    <line x1="34" y1="57" x2="68" y2="53" stroke="rgba(245,158,11,0.25)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="34" y1="66" x2="60" y2="62" stroke="rgba(245,158,11,0.2)"  stroke-width="1.5" stroke-linecap="round"/>
    <!-- Lines on right page -->
    <line x1="84" y1="44" x2="118" y2="48" stroke="rgba(245,158,11,0.35)" stroke-width="2" stroke-linecap="round"/>
    <line x1="84" y1="53" x2="118" y2="57" stroke="rgba(245,158,11,0.25)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="84" y1="62" x2="108" y2="65" stroke="rgba(245,158,11,0.2)"  stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- "NO COVER" label -->
  <text x="310" y="432" text-anchor="middle"
        font-family="'Open Sans', sans-serif"
        font-size="13" font-weight="700"
        letter-spacing="0.18em" text-transform="uppercase"
        fill="rgba(245,158,11,0.55)">
    NO COVER
  </text>

  <!-- Decorative thin line above placeholder label -->
  <line x1="210" y1="451" x2="410" y2="451" stroke="rgba(245,158,11,0.18)" stroke-width="1"/>

  <!-- Bottom text lines (simulate title/author placeholder) -->
  <rect x="175" y="480" width="270" height="11" rx="5" fill="rgba(255,255,255,0.1)"/>
  <rect x="215" y="500" width="190" height="9"  rx="4" fill="rgba(255,255,255,0.07)"/>
  <rect x="245" y="518" width="130" height="8"  rx="4" fill="rgba(255,255,255,0.05)"/>

  <!-- Author line at bottom -->
  <rect x="245" y="720" width="130" height="7" rx="3" fill="rgba(245,158,11,0.18)"/>
  <rect x="220" y="734" width="180" height="6" rx="3" fill="rgba(245,158,11,0.12)"/>
</svg>
